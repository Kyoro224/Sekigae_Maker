<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ▼ PNGアイコン（ファビコン）の設定 ▼ -->
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    
    <!-- ▼ Web検索時のタイトルと説明文の設定 ▼ -->
    <title>シンプル席替えメーカー | 完全ランダム＆男女ペア対応</title>
    <meta name="description" content="クラスの席替えをサクッと簡単に！完全ランダム配置や男女ペア配置に対応。シンプルで手軽に使える席替えツールです。">
    
    <!-- ▼ SNSシェア時のプレビュー表示（OGP）設定 ▼ -->
    <meta property="og:title" content="シンプル席替えメーカー">
    <meta property="og:description" content="クラスの席替えをサクッと簡単に！完全ランダムや男女ペア配置が可能なWebアプリケーションです。">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="シンプル席替えメーカー">

    <style>
        :root {
            --primary-color: #6577B3;
            --primary-hover: #54649b;
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 760px;
            background: var(--card-bg);
            padding: 32px 24px;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-top {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 4px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--text-color);
            font-weight: 700;
        }

        .section-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-color);
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: var(--primary-color);
        }

        .settings-row {
            display: flex;
            gap: 16px;
        }

        .settings-row > div {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            background: #fff;
            outline: none;
            cursor: pointer;
        }

        .gender-inputs {
            display: none;
            gap: 16px;
        }

        .gender-inputs.active {
            display: flex;
        }

        .single-input-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .single-input-container.inactive {
            display: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        /* 枠なしのシンプルな注意書き（ボタン直下、結果大枠の直上に配置） */
        .gender-hint-box {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.5;
            display: none;
        }

        .gender-hint-box.active {
            display: block;
        }

        /* 席の結果表示エリア */
        .seating-area {
            display: none;
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            max-height: 450px; 
            overflow-y: auto;
            flex-direction: column;
            gap: 12px;
        }

        .teacher-desk {
            background: #e2e8f0;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .desk-grid {
            display: grid;
            gap: 6px;
        }

        .desk-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 2px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
            word-break: break-all;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            cursor: pointer;
            transition: transform 0.1s, border-color 0.1s;
            min-height: 42px;
        }

        .desk-card:active {
            transform: scale(0.95);
        }

        .desk-card.selected {
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 0 3px rgba(101, 119, 179, 0.3);
        }

        .desk-card.empty {
            background-color: transparent;
            border: 1px dashed var(--border-color);
            box-shadow: none;
            cursor: pointer;
        }

        .desk-card.boy {
            background-color: #eff6ff;
            color: #1e40af;
        }

        .desk-card.girl {
            background-color: #fdf2f8;
            color: #9d174d;
        }

        /* 結果エリアの操作ボタン（拡大・保存） */
        .result-actions {
            display: none;
            gap: 8px;
        }

        .result-actions.active {
            display: flex;
        }

        .action-sub-btn {
            flex: 1;
            padding: 10px;
            background-color: #f3f4f6;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .action-sub-btn:hover {
            background-color: #e5e7eb;
        }

        /* 拡大モーダルのスタイル */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 24px;
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .close-modal-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
            line-height: 1;
        }

        .modal-body {
            overflow-y: auto;
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .footer-links {
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 4px;
        }

        .footer-links a {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
        }

        .footer-links a:hover {
            color: var(--primary-color);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-top">
            <h1>席替えメーカー</h1>
        </div>

        <div class="section-group single-input-container" id="totalInputGroup">
            <label for="totalCountInput">クラスの人数（出席番号の合計）</label>
            <input type="number" id="totalCountInput" min="2" max="100" value="30" placeholder="例: 30">
        </div>

        <div class="gender-inputs" id="genderInputGroup">
            <div class="section-group" style="flex: 1;">
                <label for="boyCountInput">男子の人数</label>
                <input type="number" id="boyCountInput" min="0" max="100" value="15" placeholder="例: 15">
            </div>
            <div class="section-group" style="flex: 1;">
                <label for="girlCountInput">女子の人数</label>
                <input type="number" id="girlCountInput" min="0" max="100" value="15" placeholder="例: 15">
            </div>
        </div>

        <div class="settings-row">
            <div class="section-group">
                <label for="columnsSelect">横の列数</label>
                <select id="columnsSelect">
                    <option value="1">1列</option>
                    <option value="2">2列</option>
                    <option value="3">3列</option>
                    <option value="4">4列</option>
                    <option value="5">5列</option>
                    <option value="6" selected>6列</option>
                    <option value="7">7列</option>
                    <option value="8">8列</option>
                </select>
            </div>
            <div class="settings-row" style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
                <label for="pairModeSelect">配置モード</label>
                <select id="pairModeSelect" onchange="toggleModeInputs()">
                    <option value="normal">完全ランダム</option>
                    <option value="boyGirl">男女ペア</option>
                </select>
            </div>
        </div>

        <button class="btn" onclick="shuffleSeats()">席替えを実行する！</button>

        <!-- ボタン直下、結果大枠の直上に配置したモード別の案内書き -->
        <div class="gender-hint-box active" id="genderHintBox"></div>

        <!-- 席の結果表示エリア（大枠） -->
        <div class="seating-area" id="seatingArea">
            <div class="teacher-desk">ひなおもて（教壇）</div>
        </div>

        <!-- 結果エリアの操作ボタン（拡大・保存） -->
        <div class="result-actions" id="resultActions">
            <button class="action-sub-btn" onclick="openModal()">🔍 拡大表示する</button>
            <button class="action-sub-btn" onclick="downloadSeatingImage()">💾 画像で保存</button>
        </div>

        <div class="footer-links">
            <a href="https://kyoro224.github.io/">開発者について↗</a>
            <a href="https://kyoro224.github.io/privacy/index.html">️プライバシーポリシー↗</a>
        </div>
    </div>

    <!-- 拡大表示用モーダル（背景クリックで閉じます） -->
    <div id="expandModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span>席替え結果（拡大表示）</span>
                <button class="close-modal-btn" onclick="closeModalDirect()">&times;</button>
            </div>
            <div class="modal-body" id="modalSeatingArea"></div>
            <button class="btn" onclick="downloadSeatingImage()">💾 この画像を保存する</button>
        </div>
    </div>

    <script>
        const totalInputGroup = document.getElementById('totalInputGroup');
        const genderInputGroup = document.getElementById('genderInputGroup');
        const totalCountInput = document.getElementById('totalCountInput');
        const boyCountInput = document.getElementById('boyCountInput');
        const girlCountInput = document.getElementById('girlCountInput');
        const columnsSelect = document.getElementById('columnsSelect');
        const pairModeSelect = document.getElementById('pairModeSelect');
        const seatingArea = document.getElementById('seatingArea');
        const genderHintBox = document.getElementById('genderHintBox');
        const resultActions = document.getElementById('resultActions');
        const expandModal = document.getElementById('expandModal');
        const modalSeatingArea = document.getElementById('modalSeatingArea');

        let currentPlacedItems = []; 
        let selectedIndex = null;
        let isSeatingActive = false;

        function toggleModeInputs() {
            const mode = pairModeSelect.value;
            if (mode === 'boyGirl') {
                totalInputGroup.classList.add('inactive');
                genderInputGroup.classList.add('active');
            } else {
                totalInputGroup.classList.remove('inactive');
                genderInputGroup.classList.remove('active');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedCount = localStorage.getItem('seatTotalCount');
            if (savedCount) totalCountInput.value = savedCount;

            const savedBoy = localStorage.getItem('seatBoyCount');
            if (savedBoy) boyCountInput.value = savedBoy;

            const savedGirl = localStorage.getItem('seatGirlCount');
            if (savedGirl) girlCountInput.value = savedGirl;

            const savedCols = localStorage.getItem('seatColumns');
            if (savedCols) {
                columnsSelect.value = savedCols;
            } else {
                columnsSelect.value = "6";
            }

            const savedMode = localStorage.getItem('seatPairMode');
            if (savedMode) {
                pairModeSelect.value = savedMode;
                toggleModeInputs();
            }
        });

        window.addEventListener('beforeunload', (event) => {
            if (isSeatingActive) {
                event.preventDefault();
                event.returnValue = '';
            }
        });

        function shuffleSeats() {
            const cols = parseInt(columnsSelect.value);
            const pairMode = pairModeSelect.value;
            selectedIndex = null;

            localStorage.setItem('seatColumns', cols);
            localStorage.setItem('seatPairMode', pairMode);

            if (pairMode === 'boyGirl') {
                const bCount = parseInt(boyCountInput.value);
                const gCount = parseInt(girlCountInput.value);

                if (isNaN(bCount) || bCount < 0 || isNaN(gCount) || gCount < 0 || (bCount + gCount) === 0) {
                    alert('正しい男子・女子の人数を入力してください。');
                    return;
                }

                localStorage.setItem('seatBoyCount', bCount);
                localStorage.setItem('seatGirlCount', gCount);

                let boys = [];
                let girls = [];
                for (let i = 1; i <= bCount; i++) boys.push({ text: `男${i}`, gender: 'boy' });
                for (let i = 1; i <= gCount; i++) girls.push({ text: `女${i}`, gender: 'girl' });

                boys.sort(() => Math.random() - 0.5);
                girls.sort(() => Math.random() - 0.5);

                let totalCount = bCount + gCount;
                let validItems = new Array(totalCount).fill(null);
                let rows = Math.ceil(totalCount / cols);

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        let index = r * cols + c;
                        if (index >= totalCount) break;

                        let preferBoy = ((r + c) % 2 === 0);

                        if (preferBoy) {
                            if (boys.length > 0) {
                                validItems[index] = boys.pop();
                            } else if (girls.length > 0) {
                                validItems[index] = girls.pop();
                            }
                        } else {
                            if (girls.length > 0) {
                                validItems[index] = girls.pop();
                            } else if (boys.length > 0) {
                                validItems[index] = boys.pop();
                            }
                        }
                    }
                }

                for (let i = 0; i < totalCount; i++) {
                    if (validItems[i] === null) {
                        if (boys.length > 0) validItems[i] = boys.pop();
                        else if (girls.length > 0) validItems[i] = girls.pop();
                    }
                }

                let totalSlots = rows * cols;
                let gridSlots = [...validItems];
                while (gridSlots.length < totalSlots) {
                    gridSlots.push({ text: '', gender: 'empty' });
                }

                currentPlacedItems = gridSlots;
                genderHintBox.textContent = '⚠️ 男女の人数に端数がある場合、後ろの列に人数が多い性別がまとまることがあります。席を手動でタップ・Clickして位置をご調整ください！';

            } else {
                const count = parseInt(totalCountInput.value);
                if (isNaN(count) || count <= 0) {
                    alert('正しい人数を入力してください。');
                    return;
                }
                localStorage.setItem('seatTotalCount', count);

                let items = [];
                for (let i = 1; i <= count; i++) {
                    items.push({ text: `${i}番`, gender: '' });
                }
                for (let i = items.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [items[i], items[j]] = [items[j], items[i]];
                }

                let totalSlots = Math.ceil(count / cols) * cols;
                while (items.length < totalSlots) {
                    items.push({ text: '', gender: 'empty' });
                }

                currentPlacedItems = items;
                genderHintBox.textContent = '💡 席をタップ・Clickして位置を変更することができます。';
            }

            isSeatingActive = true;
            renderSeating();
        }

        function renderSeating() {
            const cols = parseInt(columnsSelect.value);

            seatingArea.style.display = 'flex';
            genderHintBox.classList.add('active');
            resultActions.classList.add('active');

            buildGridContent(seatingArea, cols, false);
        }

        function buildGridContent(containerElement, cols, isModalContext) {
            containerElement.innerHTML = '<div class="teacher-desk">ひなおもて（教壇）</div>';
            
            const grid = document.createElement('div');
            grid.className = 'desk-grid';
            grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

            currentPlacedItems.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `desk-card ${item.gender}`;
                if (index === selectedIndex && !isModalContext) {
                    card.classList.add('selected');
                }
                card.textContent = item.text;

                card.onclick = () => {
                    if (isModalContext) return;
                    if (selectedIndex === null) {
                        selectedIndex = index;
                        renderSeating();
                    } else if (selectedIndex === index) {
                        selectedIndex = null; 
                        renderSeating();
                    } else {
                        let temp = currentPlacedItems[selectedIndex];
                        currentPlacedItems[selectedIndex] = currentPlacedItems[index];
                        currentPlacedItems[index] = temp;
                        selectedIndex = null;
                        renderSeating();
                    }
                };

                grid.appendChild(card);
            });

            containerElement.appendChild(grid);
        }

        function openModal() {
            const cols = parseInt(columnsSelect.value);
            buildGridContent(modalSeatingArea, cols, true);
            expandModal.style.display = 'flex';
        }

        function closeModal(event) {
            expandModal.style.display = 'none';
        }

        function closeModalDirect() {
            expandModal.style.display = 'none';
        }

        // ▼ HTML要素をSVG（ForeignObject）経由で正確に画像化してダウンロードする堅牢な方式 ▼
        function downloadSeatingImage() {
            // 現在画面にある席表示要素、またはモーダル内の要素を取得
            const sourceEl = expandModal.style.display === 'flex' 
                ? modalSeatingArea 
                : seatingArea;

            if (!sourceEl || sourceEl.style.display === 'none') return;

            // 複製してクローンを作成し、一時的に独立した幅・スタイルで描画用コンテナに収める
            const clone = sourceEl.cloneNode(true);
            clone.style.maxHeight = 'none';
            clone.style.overflow = 'visible';
            clone.style.display = 'flex';
            clone.style.width = sourceEl.offsetWidth + 'px';
            clone.style.backgroundColor = '#f8fafc';

            const wrapper = document.createElement('div');
            wrapper.style.position = 'absolute';
            wrapper.style.left = '-9999px';
            wrapper.style.top = '-9999px';
            wrapper.style.padding = '20px';
            wrapper.style.backgroundColor = '#ffffff';
            wrapper.style.borderRadius = '16px';
            wrapper.appendChild(clone);
            document.body.appendChild(wrapper);

            const width = wrapper.offsetWidth;
            const height = wrapper.offsetHeight;

            // HTMLをSVGの foreignObject に埋め込む
            const svgString = `
                <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">
                    <foreignObject width="100%" height="100%">
                        <div xmlns="http://www.w3.org/1999/xhtml">
                            <style>
                                * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
                                .teacher-desk { background: #e2e8f0; text-align: center; font-size: 0.8rem; color: #6b7280; padding: 8px; border-radius: 8px; font-weight: bold; letter-spacing: 3px; margin-bottom: 12px; }
                                .desk-grid { display: grid; gap: 6px; grid-template-columns: repeat(${parseInt(columnsSelect.value)}, 1fr); }
                                .desk-card { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 2px; text-align: center; font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; justify-content: center; min-height: 42px; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
                                .desk-card.empty { background-color: transparent; border: 1px dashed #e5e7eb; box-shadow: none; }
                                .desk-card.boy { background-color: #eff6ff; color: #1e40af; border-color: #bfdbfe; }
                                .desk-card.girl { background-color: #fdf2f8; color: #9d174d; border-color: #fbcfe8; }
                            </style>
                            ${wrapper.innerHTML}
                        </div>
                    </foreignObject>
                </svg>
            `;

            const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const URL = window.URL || window.webkitURL || window;
            const blobURL = URL.createObjectURL(blob);

            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = width * 2; // 高解像度（Retina対応）
                canvas.height = height * 2;
                const ctx = canvas.getContext('2d');
                ctx.scale(2, 2);

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, width, height);
                ctx.drawImage(img, 0, 0);

                URL.revokeObjectURL(blobURL);
                document.body.removeChild(wrapper);

                const link = document.createElement('a');
                link.download = 'seating-chart.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
            img.src = blobURL;
        }
    </script>
</body>
</html>
